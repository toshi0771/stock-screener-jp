name: 200-Day Pullback Screening

on:
  schedule:
    # 平日 17:30 JST (08:30 UTC) - yfinance使用のため早期実行可能
    - cron: '30 8 * * 1-5'
    # 朝の再実行 05:47 / 07:47 JST（夜の実行が保存済みなら自動でスキップ）
    # - cron: '47 20 * * 1-5'
    # - cron: '47 22 * * 1-5'
  workflow_dispatch:
    inputs:
      auto:
        description: '外部サービスからの自動起動（trueのとき、定時実行と同じ扱い: 保存済みならスキップ）'
        required: false
        default: 'false'

concurrency:
  group: jquants-api-access
  cancel-in-progress: false

jobs:
  screen-200day-pullback:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6時間
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Restore stock price cache
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/stock_prices
        key: stock-prices-cache-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          stock-prices-cache-${{ runner.os }}-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run 200-Day Pullback Screening
      env:
        JQUANTS_REFRESH_TOKEN: ${{ secrets.JQUANTS_REFRESH_TOKEN }}
        JQUANTS_TOKEN_CREATED_DATE: ${{ secrets.JQUANTS_TOKEN_CREATED_DATE }}
        JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        AUTO_RUN: ${{ github.event.inputs.auto }}
      run: |
        python run_200day_pullback.py
    
    - name: Save stock price cache
      uses: actions/cache/save@v5
      if: always()
      with:
        path: ~/.cache/stock_prices
        key: stock-prices-cache-${{ runner.os }}-${{ github.run_id }}
